name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend tests scripts
      - run: pytest
      - run: node scripts/verify_vectors.mjs testdata/chain_vectors_v1.json
